version: 2

project_name: sub2api

builds:
  - id: sub2api
    dir: backend
    main: ./cmd/server
    binary: sub2api
    flags:
      - -tags=embed
    env:
      - CGO_ENABLED=0
      - GOFLAGS=-mod=readonly
    goos:
      - linux
      - windows
      - darwin
    goarch:
      - amd64
      - arm64
    ignore:
      - goos: windows
        goarch: arm64
    ldflags:
      - -s -w
      - -X main.Version={{ .Env.RELEASE_VERSION }}
      - -X main.Commit={{ .Commit }}
      - -X main.Date={{ .Date }}
      - -X main.BuildType=release

archives:
  - id: default
    formats:
      - tar.gz
    name_template: >-
      {{ .ProjectName }}_{{ .Env.RELEASE_VERSION }}_{{ .Os }}_{{ .Arch }}
    format_overrides:
      - goos: windows
        formats:
          - zip
    files:
      - LICENSE*
      - README*
      - deploy/*

checksum:
  name_template: checksums.txt
  algorithm: sha256

changelog:
  disable: true

dockers_v2:
  - id: ghcr
    ids:
      - sub2api
    dockerfile: Dockerfile.goreleaser
    images:
      - ghcr.io/{{ .Env.GITHUB_REPO_OWNER_LOWER }}/sub2api
    tags:
      - '{{ .Env.RELEASE_VERSION }}'
    platforms:
      - linux/amd64
      - linux/arm64
    extra_files:
      - deploy/docker-entrypoint.sh
      - backend/resources
    labels:
      org.opencontainers.image.version: '{{ .Env.RELEASE_VERSION }}'
      org.opencontainers.image.revision: '{{ .FullCommit }}'
      org.opencontainers.image.source: 'https://github.com/{{ .Env.GITHUB_REPO_OWNER }}/{{ .Env.GITHUB_REPO_NAME }}'

release:
  github:
    owner: '{{ .Env.GITHUB_REPO_OWNER }}'
    name: '{{ .Env.GITHUB_REPO_NAME }}'
  draft: true
  prerelease: false
  name_template: Sub2API RU {{ .Env.RELEASE_TAG }}
  header: |
    > RU fork release based on upstream {{ .Env.RELEASE_BASE_TAG }}.

    {{ .Env.TAG_MESSAGE }}
  footer: |
    ---

    ## Integrity

    Download `checksums.txt` from this release and verify assets with:

    ```bash
    sha256sum -c checksums.txt
    ```

    ## GHCR image

    ```bash
    docker pull ghcr.io/{{ .Env.GITHUB_REPO_OWNER_LOWER }}/sub2api:{{ .Env.RELEASE_VERSION }}
    ```
