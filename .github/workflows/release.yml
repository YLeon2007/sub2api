name: RU Release

on:
  push:
    tags:
      - 'v*.*.*-ru.*'

permissions:
  contents: write
  packages: write

concurrency:
  group: ru-release-${{ github.ref_name }}
  cancel-in-progress: false

env:
  UPSTREAM_REPO: Wei-Shaw/sub2api
  LANG: C.UTF-8
  LC_ALL: C.UTF-8

jobs:
  release:
    name: Build checksum-backed assets and GHCR image
    if: github.repository == 'YLeon2007/sub2api' && github.ref_type == 'tag'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout release tag
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
          ref: ${{ github.ref }}

      - name: Fetch upstream stable tags
        run: |
          git remote add upstream-release "https://github.com/${UPSTREAM_REPO}.git" 2>/dev/null || \
            git remote set-url upstream-release "https://github.com/${UPSTREAM_REPO}.git"
          git for-each-ref --format='delete %(refname)' refs/upstream-tags/ | git update-ref --stdin
          git fetch --force --no-tags upstream-release '+refs/tags/v*:refs/upstream-tags/v*'

      - name: Validate RU release tag and base tag
        id: guard
        run: >-
          python tools/ru_release_guard.py
          --repo-root .
          --upstream-ref-prefix refs/upstream-tags/
          --emit-github-output

      - name: Read tag message
        id: tag_message
        env:
          RELEASE_TAG: ${{ steps.guard.outputs.tag }}
        run: |
          python - <<'PY'
          import os
          import subprocess
          import uuid

          message = subprocess.run(
              ["git", "tag", "-l", "--format=%(contents:body)", os.environ["RELEASE_TAG"]],
              check=True,
              stdout=subprocess.PIPE,
              text=True,
          ).stdout
          message_lines = set(message.splitlines())
          delimiter = f"TAG_MESSAGE_{uuid.uuid4().hex}"
          while delimiter in message_lines:
              delimiter = f"TAG_MESSAGE_{uuid.uuid4().hex}"

          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as handle:
              handle.write(f"message<<{delimiter}\n")
              handle.write(message)
              if not message.endswith("\n"):
                  handle.write("\n")
              handle.write(f"{delimiter}\n")
          PY

      - name: Set lowercase owner for GHCR
        id: lowercase
        run: |
          owner="$(printf '%s' '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')"
          echo "owner=${owner}" >> "$GITHUB_OUTPUT"

      - name: Setup pnpm
        uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6
        with:
          version: 10.15.0

      - name: Setup Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '20'
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Install frontend dependencies
        working-directory: frontend
        run: pnpm install --frozen-lockfile

      - name: Run exact-tag frontend dependency audit
        working-directory: frontend
        run: |
          pnpm audit --prod --audit-level=high --json > "${RUNNER_TEMP}/pnpm-audit.json" || true
          python ../tools/check_pnpm_audit_exceptions.py \
            --audit "${RUNNER_TEMP}/pnpm-audit.json" \
            --exceptions ../.github/audit-exceptions.yml

      - name: Run exact-tag frontend gate and build embedded assets
        working-directory: frontend
        run: |
          pnpm run lint:check
          pnpm run test:run
          pnpm run typecheck
          pnpm run build

      - name: Setup Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version-file: backend/go.mod
          check-latest: false
          cache: true
          cache-dependency-path: backend/go.sum

      - name: Verify Go version from go.mod
        run: |
          expected="go$(awk '/^go / {print $2; exit}' backend/go.mod)"
          actual="$(go env GOVERSION)"
          test "$actual" = "$expected"

      - name: Run exact-tag Go vulnerability scan
        working-directory: backend
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@v1.6.0
          govulncheck ./...

      - name: Run exact-tag backend unit tests
        working-directory: backend
        run: make test-unit

      - name: Run exact-tag installer integrity tests
        run: |
          bash deploy/tests/install-github-token-test.sh
          bash deploy/tests/install-checksum-integrity-test.sh

      - name: Set up QEMU
        uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130 # v3
        with:
          image: tonistiigi/binfmt@sha256:400a4873b838d1b89194d982c45e5fb3cda4593fbfd7e08a02e76b03b21166f0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
        with:
          driver-opts: image=moby/buildkit@sha256:28a898719c18a33f4e8000685287fa36fd0dd9560c6440227d3a732d79bb41d8

      - name: Login to GitHub Container Registry
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ github.token }}

      - name: Require unused immutable publication targets
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.guard.outputs.tag }}
          RELEASE_VERSION: ${{ steps.guard.outputs.version }}
          GHCR_REPOSITORY: ${{ steps.lowercase.outputs.owner }}/sub2api
        run: |
          python - <<'PY'
          import base64
          import json
          import os
          import urllib.error
          import urllib.parse
          import urllib.request

          def request_status(url, headers):
              request = urllib.request.Request(url, headers=headers)
              try:
                  with urllib.request.urlopen(request, timeout=30) as response:
                      return response.status, response.read()
              except urllib.error.HTTPError as error:
                  return error.code, error.read()

          actor = os.environ.get("GITHUB_ACTOR", "").strip()
          github_token = os.environ.get("GH_TOKEN", "").strip()
          release_tag = os.environ.get("RELEASE_TAG", "").strip()
          release_version = os.environ.get("RELEASE_VERSION", "").strip()
          repository = os.environ.get("GHCR_REPOSITORY", "").strip().lower()
          if not all((actor, github_token, release_tag, release_version, repository)):
              raise SystemExit("immutable-target preflight is missing required identity or credentials")

          release_url = (
              "https://api.github.com/repos/YLeon2007/sub2api/releases/tags/"
              + urllib.parse.quote(release_tag, safe="")
          )
          release_status, _ = request_status(
              release_url,
              {
                  "Accept": "application/vnd.github+json",
                  "Authorization": f"Bearer {github_token}",
                  "X-GitHub-Api-Version": "2022-11-28",
              },
          )
          if release_status == 200:
              raise SystemExit(f"GitHub Release {release_tag} already exists; refusing overwrite")
          if release_status != 404:
              raise SystemExit(f"GitHub Release absence probe returned HTTP {release_status}, expected exact 404")

          basic = base64.b64encode(f"{actor}:{github_token}".encode()).decode()
          token_url = "https://ghcr.io/token?" + urllib.parse.urlencode(
              {"scope": f"repository:{repository}:pull", "service": "ghcr.io"}
          )
          token_status, token_body = request_status(
              token_url,
              {"Accept": "application/json", "Authorization": f"Basic {basic}"},
          )
          if token_status != 200:
              raise SystemExit(f"GHCR token probe returned HTTP {token_status}")
          try:
              registry_token = json.loads(token_body).get("token", "")
          except (UnicodeDecodeError, json.JSONDecodeError) as error:
              raise SystemExit("GHCR token probe returned malformed JSON") from error
          if not isinstance(registry_token, str) or not registry_token:
              raise SystemExit("GHCR token probe returned no token")

          manifest_url = (
              f"https://ghcr.io/v2/{repository}/manifests/"
              + urllib.parse.quote(release_version, safe="")
          )
          manifest_status, _ = request_status(
              manifest_url,
              {
                  "Accept": (
                      "application/vnd.oci.image.index.v1+json,"
                      "application/vnd.docker.distribution.manifest.list.v2+json,"
                      "application/vnd.oci.image.manifest.v1+json"
                  ),
                  "Authorization": f"Bearer {registry_token}",
              },
          )
          if manifest_status == 200:
              raise SystemExit(f"GHCR image {repository}:{release_version} already exists; refusing overwrite")
          if manifest_status != 404:
              raise SystemExit(f"GHCR manifest absence probe returned HTTP {manifest_status}, expected exact 404")

          print(f"Immutable publication targets are unused: {release_tag}, {repository}:{release_version}")
          PY

      - name: Create RU-only GoReleaser config
        run: |
          cat > "${RUNNER_TEMP}/goreleaser.ru.yaml" <<'YAML'
          version: 2

          project_name: sub2api

          builds:
            - id: sub2api
              dir: backend
              main: ./cmd/server
              binary: sub2api
              flags:
                - -tags=embed
              env:
                - CGO_ENABLED=0
                - GOFLAGS=-mod=readonly
              goos:
                - linux
                - windows
                - darwin
              goarch:
                - amd64
                - arm64
              ignore:
                - goos: windows
                  goarch: arm64
              ldflags:
                - -s -w
                - -X main.Version={{ .Env.RELEASE_VERSION }}
                - -X main.Commit={{ .Commit }}
                - -X main.Date={{ .Date }}
                - -X main.BuildType=release

          archives:
            - id: default
              formats:
                - tar.gz
              name_template: >-
                {{ .ProjectName }}_{{ .Env.RELEASE_VERSION }}_{{ .Os }}_{{ .Arch }}
              format_overrides:
                - goos: windows
                  formats:
                    - zip
              files:
                - LICENSE*
                - README*
                - deploy/*

          checksum:
            name_template: checksums.txt
            algorithm: sha256

          changelog:
            disable: true

          dockers_v2:
            - id: ghcr
              ids:
                - sub2api
              dockerfile: Dockerfile.goreleaser
              images:
                - ghcr.io/{{ .Env.GITHUB_REPO_OWNER_LOWER }}/sub2api
              tags:
                - '{{ .Env.RELEASE_VERSION }}'
              platforms:
                - linux/amd64
                - linux/arm64
              extra_files:
                - deploy/docker-entrypoint.sh
                - backend/resources
              labels:
                org.opencontainers.image.version: '{{ .Env.RELEASE_VERSION }}'
                org.opencontainers.image.revision: '{{ .FullCommit }}'
                org.opencontainers.image.source: 'https://github.com/{{ .Env.GITHUB_REPO_OWNER }}/{{ .Env.GITHUB_REPO_NAME }}'

          release:
            github:
              owner: '{{ .Env.GITHUB_REPO_OWNER }}'
              name: '{{ .Env.GITHUB_REPO_NAME }}'
            draft: true
            prerelease: false
            name_template: Sub2API RU {{ .Env.RELEASE_TAG }}
            header: |
              > RU fork release based on upstream {{ .Env.RELEASE_BASE_TAG }}.

              {{ .Env.TAG_MESSAGE }}
            footer: |
              ---

              ## Integrity

              Download `checksums.txt` from this release and verify assets with:

              ```bash
              sha256sum -c checksums.txt
              ```

              ## GHCR image

              ```bash
              docker pull ghcr.io/{{ .Env.GITHUB_REPO_OWNER_LOWER }}/sub2api:{{ .Env.RELEASE_VERSION }}
              ```
          YAML
          python tools/validate_ru_automation.py --repo-root . --goreleaser-config "${RUNNER_TEMP}/goreleaser.ru.yaml"

      - name: Install verified GoReleaser
        env:
          GORELEASER_VERSION: v2.17.1
          GORELEASER_ARCHIVE_SHA256: a99bbc7ae0d8d897b07c4c497a9b62f222558804715ef219d1af05a7e417bc80
          GORELEASER_BINARY_SHA256: 1bd4bff62897b99fd790104bd374049c8c486498da43240a3c97555e4d644b85
        run: |
          install_dir="${RUNNER_TEMP}/goreleaser"
          archive_name="goreleaser_Linux_x86_64.tar.gz"
          archive_path="${install_dir}/${archive_name}"
          checksums_path="${install_dir}/checksums.txt"
          mkdir -m 0700 "$install_dir"
          curl --fail --silent --show-error --location --proto '=https' --tlsv1.2 \
            "https://github.com/goreleaser/goreleaser/releases/download/${GORELEASER_VERSION}/checksums.txt" \
            --output "$checksums_path"
          curl --fail --silent --show-error --location --proto '=https' --tlsv1.2 \
            "https://github.com/goreleaser/goreleaser/releases/download/${GORELEASER_VERSION}/${archive_name}" \
            --output "$archive_path"
          mapfile -t checksum_rows < <(awk -v name="$archive_name" '$2 == name { print $1 }' "$checksums_path")
          test "${#checksum_rows[@]}" -eq 1
          test "${checksum_rows[0]}" = "$GORELEASER_ARCHIVE_SHA256"
          printf '%s  %s\n' "$GORELEASER_ARCHIVE_SHA256" "$archive_path" | sha256sum -c -
          tar -xzf "$archive_path" -C "$install_dir" goreleaser
          printf '%s  %s\n' "$GORELEASER_BINARY_SHA256" "${install_dir}/goreleaser" | sha256sum -c -
          chmod 0755 "${install_dir}/goreleaser"
          printf '%s\n' "$install_dir" >> "$GITHUB_PATH"

      - name: Run GoReleaser
        env:
          GITHUB_TOKEN: ${{ github.token }}
          TAG_MESSAGE: ${{ steps.tag_message.outputs.message }}
          RELEASE_TAG: ${{ steps.guard.outputs.tag }}
          RELEASE_VERSION: ${{ steps.guard.outputs.version }}
          RELEASE_BASE_TAG: ${{ steps.guard.outputs.base_tag }}
          GITHUB_REPO_OWNER: ${{ github.repository_owner }}
          GITHUB_REPO_OWNER_LOWER: ${{ steps.lowercase.outputs.owner }}
          GITHUB_REPO_NAME: ${{ github.event.repository.name }}
        run: goreleaser release --clean --config="${RUNNER_TEMP}/goreleaser.ru.yaml"

      - name: Verify Linux release binary identity
        env:
          RELEASE_VERSION: ${{ steps.guard.outputs.version }}
          EXPECTED_COMMIT: ${{ github.sha }}
        run: |
          version_output="$(dist/sub2api_linux_amd64_v1/sub2api --version 2>&1)"
          printf '%s\n' "$version_output"
          printf '%s\n' "$version_output" | grep -F "Sub2API ${RELEASE_VERSION} "
          printf '%s\n' "$version_output" | grep -F "commit: ${EXPECTED_COMMIT}"

      - name: Verify local release checksums
        run: |
          test -s dist/checksums.txt
          (cd dist && sha256sum -c checksums.txt)

      - name: Verify versioned GHCR manifest
        id: image
        run: |
          image="ghcr.io/${{ steps.lowercase.outputs.owner }}/sub2api:${{ steps.guard.outputs.version }}"
          inspect="$(docker buildx imagetools inspect "$image")"
          printf '%s\n' "$inspect"
          digest="$(printf '%s\n' "$inspect" | awk '$1 == "Digest:" {print $2; exit}')"
          case "$digest" in
            sha256:*) ;;
            *) echo "Unable to resolve manifest digest for ${image}" >&2; exit 1 ;;
          esac
          echo "image=${image}" >> "$GITHUB_OUTPUT"
          echo "digest=${digest}" >> "$GITHUB_OUTPUT"

      - name: Publish verified metadata and release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.guard.outputs.tag }}
          RELEASE_VERSION: ${{ steps.guard.outputs.version }}
          RELEASE_BASE_TAG: ${{ steps.guard.outputs.base_tag }}
          RELEASE_BASE_REF: ${{ steps.guard.outputs.base_ref }}
          IMAGE: ${{ steps.image.outputs.image }}
          IMAGE_DIGEST: ${{ steps.image.outputs.digest }}
        run: |
          export RU_COMMIT="$(git rev-parse HEAD)"
          export UPSTREAM_COMMIT="$(git rev-list -n 1 "${RELEASE_BASE_REF}")"
          export BUILD_DATE="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          export CHECKSUMS_SHA256="$(sha256sum dist/checksums.txt | awk '{print $1}')"
          python - <<'PY'
          import os
          from pathlib import Path

          metadata = "\n".join([
              f"release_tag={os.environ['RELEASE_TAG']}",
              f"release_version={os.environ['RELEASE_VERSION']}",
              f"upstream_tag={os.environ['RELEASE_BASE_TAG']}",
              f"upstream_commit={os.environ['UPSTREAM_COMMIT']}",
              f"ru_commit={os.environ['RU_COMMIT']}",
              f"build_date={os.environ['BUILD_DATE']}",
              f"image={os.environ['IMAGE']}",
              f"image_digest={os.environ['IMAGE_DIGEST']}",
              f"checksums_sha256={os.environ['CHECKSUMS_SHA256']}",
          ]) + "\n"
          Path("dist/release-metadata.txt").write_text(metadata, encoding="utf-8")
          PY
          (cd dist && sha256sum release-metadata.txt > release-metadata.txt.sha256)
          gh release upload -R YLeon2007/sub2api "${RELEASE_TAG}" \
            dist/release-metadata.txt \
            dist/release-metadata.txt.sha256
          gh release view -R YLeon2007/sub2api "${RELEASE_TAG}" --json body --jq .body > "${RUNNER_TEMP}/release-body.md"
          cat >> "${RUNNER_TEMP}/release-body.md" <<EOF

          <!-- ru-build-metadata -->
          ## Verified build metadata

          - Upstream: \`${RELEASE_BASE_TAG}\` (\`${UPSTREAM_COMMIT}\`)
          - RU commit: \`${RU_COMMIT}\`
          - Build date: \`${BUILD_DATE}\`
          - Image: \`${IMAGE}@${IMAGE_DIGEST}\`
          - checksums.txt SHA-256: \`${CHECKSUMS_SHA256}\`
          EOF
          gh release edit -R YLeon2007/sub2api "${RELEASE_TAG}" \
            --notes-file "${RUNNER_TEMP}/release-body.md" \
            --draft=false
